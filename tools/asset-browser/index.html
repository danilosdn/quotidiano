<!doctype html><meta charset="utf-8"><title>LimeZu Asset Browser</title><style>body{font:14px system-ui;margin:24px;background:#f4f0e8;color:#20352c}header{position:sticky;top:0;background:#f4f0e8;padding:12px 0}button{margin:3px;padding:7px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #d9d1c4;padding:8px;overflow:hidden}.card img{width:100%;height:130px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/16px 16px}.card small{display:block;overflow-wrap:anywhere}</style><header><h1>LimeZu Asset Browser</h1><div id="filters"></div><p id="summary"></p></header><main class="grid" id="grid"></main><script type="module">const categories=['Quarto','Banheiro','Cozinha','Sala','Entrada','Lavanderia','Decoração'];let selected='Todos';const filters=document.querySelector('#filters');const grid=document.querySelector('#grid');const data=await fetch('./inventory.json').then(r=>r.json());filters.innerHTML=['Todos',...categories].map(c=>`<button data-c="${c}">${c}</button>`).join('');function render(){const items=data.records.filter(x=>x.category===selected||selected==='Todos').filter(x=>['.png','.gif'].includes(x.extension)&&x.sourcePath.includes('48x48')).slice(0,600);document.querySelector('#summary').textContent=`${items.length} de ${data.total} arquivos; filtro: ${selected}. Previews usam os arquivos raw locais.`;grid.innerHTML=items.map(x=>`<article class="card"><img src="../../${x.sourcePath}" alt=""><strong>${x.filename}</strong><small>${x.pack}</small><small>${x.width??'?'}×${x.height??'?'} · ${x.category}</small><small>${x.sourcePath}</small></article>`).join('')}filters.onclick=e=>{if(e.target.dataset.c){selected=e.target.dataset.c;render()}};render();</script>
